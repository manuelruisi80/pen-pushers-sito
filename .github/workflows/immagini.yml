name: Immagini Insights

on:
  push:
    branches: [bozze, main]
    paths: ['_src/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immagini-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Scarica le foto (Unsplash / Pexels)
        run: python _src/fetch_photos.py
      - name: Genera pagine e immagini
        run: python _src/build.py
      - name: Salva il risultato
        run: |
          git config user.name "Redazione Insights"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nessuna modifica"; exit 0; fi
          git commit -m "Immagini aggiornate [automatico]"
          git push
